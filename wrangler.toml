name = "cpajobs"
main = "src/main.js"

# Cloudflare KV namespace configuration
kv_namespaces = [
  { binding = "CPAJOBS_KV", id = "c50ca671669c49f59c9b16b76cefa690" }
]

# D1 database configuration
d1_databases = [
  { binding = "DB", database_name = "cpajobs-db" }
]

# Cloudflare Workers routes matching the blueprint exactly
# Phase 1 API endpoints
# Routes are handled internally by the fetch handler
# For production deployment with custom domain, add routes here
# routes = [
#   "example.com/offers",
#   "example.com/offers/:id",
#   "example.com/track/click",
#   ...
# ]

# Compatibility date for Cloudflare Workers
compatibility_date = "2026-09-03"

# Scheduled cron job for OnJob.io feed import
# Runs daily at 2 AM UTC
[triggers]
crons = ["0 2 * * *"]