name = "usajobs"
main = "src/main.js"

# Cloudflare KV namespace configuration
kv_namespaces = [
  { binding = "CPAJOBS_KV", id = "c50ca671669c49f59c9b16b76cefa690" }
]

# D1 database configuration
d1_databases = [
  { binding = "DB", database_name = "cpajobs-db", database_id = "e05af5a8-824b-493b-a9b0-1ce06ce8566e", migrations_dir = "src/db/migrations" }
]

# Compatibility date for Cloudflare Workers
compatibility_date = "2026-09-03"

# Scheduled cron job for Ashby job import (15:59 UTC daily)
[triggers]
crons = ["59 15 * * *"]

# Production environment configuration
[env.production]
vars = { ENVIRONMENT = "production", CANONICAL_HOSTNAME = "usajobs.usajobs.workers.dev", ASHBY_JOB_BOARD_NAME = "notion" }
